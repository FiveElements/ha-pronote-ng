<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380" role="img" aria-label="Aperçu de trois cartes Pronote NG : prochain cours, devoirs et vie scolaire. Toutes les valeurs affichées sont fictives.">
  <title>Pronote NG — Cartes : aperçu</title>
  <desc>Illustration synthétique. Aucune donnée réelle : les matières, les noms et la classe sont inventés pour cette image.</desc>

  <style>
    .bg { fill: #f2f4f7; }
    .card { fill: #ffffff; }
    .shadow { fill: #101828; opacity: .06; }
    .h { font: 600 15px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #101828; }
    .p { font: 400 13px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #101828; }
    .s { font: 400 11.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #667085; }
    .t { font: 400 12.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #667085; }
    .sect { font: 600 11px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; fill: #475467; letter-spacing: .04em; }
    .chip { font: 600 10.5px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    .rule { stroke: #eaecf0; stroke-width: 1; }
  </style>

  <rect class="bg" width="900" height="380" rx="0"/>

  <!-- ── Carte 1 : prochain cours ───────────────────────────────── -->
  <g transform="translate(20 20)">
    <rect class="shadow" x="1" y="3" width="276" height="340" rx="12"/>
    <rect class="card" width="276" height="340" rx="12"/>

    <g transform="translate(18 30)">
      <rect x="0" y="-14" width="118" height="20" rx="10" fill="#eaf3ff"/>
      <text class="chip" x="10" y="0" fill="#175cd3">Cours en ce moment</text>
    </g>

    <text class="sect" x="18" y="66">PROCHAIN COURS</text>
    <line class="rule" x1="18" y1="78" x2="258" y2="78"/>

    <text class="p" x="18" y="102">Français</text>
    <text class="s" x="18" y="120">10:30 – ≈11:30 · dans 22 min</text>

    <line class="rule" x1="18" y1="136" x2="258" y2="136"/>
    <text class="p" x="18" y="160">Salle 2.9</text>
    <line class="rule" x1="18" y1="176" x2="258" y2="176"/>
    <text class="p" x="18" y="200">Mme A.</text>
    <line class="rule" x1="18" y1="216" x2="258" y2="216"/>
    <text class="p" x="18" y="240">Réveil à 08:00</text>
    <line class="rule" x1="18" y1="256" x2="258" y2="256"/>
    <text class="p" x="18" y="280">Fin des cours à 12:30 <tspan class="s">≈</tspan></text>

    <text class="s" x="18" y="314">≈ heure déduite, non fournie</text>
    <text class="s" x="18" y="330">par le serveur</text>
  </g>

  <!-- ── Carte 2 : devoirs ──────────────────────────────────────── -->
  <g transform="translate(312 20)">
    <rect class="shadow" x="1" y="3" width="276" height="340" rx="12"/>
    <rect class="card" width="276" height="340" rx="12"/>

    <g transform="translate(18 30)">
      <rect x="0" y="-14" width="70" height="20" rx="10" fill="#fef3f2"/>
      <text class="chip" x="10" y="0" fill="#b42318">en retard</text>
    </g>

    <text class="sect" x="18" y="66">JEUDI 10 SEPTEMBRE</text>
    <line class="rule" x1="18" y1="78" x2="258" y2="78"/>

    <g transform="translate(18 92)">
      <rect x="0" y="0" width="13" height="13" rx="3" fill="#ffffff" stroke="#98a2b3"/>
      <text class="p" x="22" y="11">Mathématiques</text>
      <text class="s" x="0" y="30">Exercices 22 et 23, page 9.</text>
      <text class="t" x="0" y="48">pour le jeudi 10 septembre</text>
    </g>

    <line class="rule" x1="18" y1="158" x2="258" y2="158"/>

    <g transform="translate(18 172)">
      <rect x="0" y="0" width="13" height="13" rx="3" fill="#ffffff" stroke="#98a2b3"/>
      <text class="p" x="22" y="11">Anglais</text>
      <text class="s" x="0" y="30">Réviser les fiches du cahier.</text>
      <text class="t" x="0" y="48">pour le jeudi 10 septembre</text>
    </g>

    <line class="rule" x1="18" y1="238" x2="258" y2="238"/>
    <text class="sect" x="18" y="262">VENDREDI 11 SEPTEMBRE</text>
    <line class="rule" x1="18" y1="274" x2="258" y2="274"/>

    <g transform="translate(18 288)">
      <rect x="0" y="0" width="13" height="13" rx="3" fill="#ffffff" stroke="#98a2b3"/>
      <text class="p" x="22" y="11">Espagnol</text>
      <text class="s" x="0" y="30">Apprendre l'alphabet.</text>
    </g>
  </g>

  <!-- ── Carte 3 : vie scolaire ─────────────────────────────────── -->
  <g transform="translate(604 20)">
    <rect class="shadow" x="1" y="3" width="276" height="340" rx="12"/>
    <rect class="card" width="276" height="340" rx="12"/>

    <text class="p" x="18" y="38">Absences</text>
    <text class="p" x="258" y="38" text-anchor="end">1</text>
    <line class="rule" x1="18" y1="52" x2="258" y2="52"/>

    <text class="p" x="18" y="76">Absences non justifiées</text>
    <g transform="translate(228 62)">
      <rect x="0" y="0" width="30" height="20" rx="10" fill="#fffaeb"/>
      <text class="chip" x="15" y="14" fill="#b54708" text-anchor="middle">0</text>
    </g>
    <line class="rule" x1="18" y1="90" x2="258" y2="90"/>

    <text class="p" x="18" y="114">Retards</text>
    <text class="p" x="258" y="114" text-anchor="end">0</text>
    <line class="rule" x1="18" y1="128" x2="258" y2="128"/>

    <text class="p" x="18" y="152">Punitions</text>
    <text class="p" x="258" y="152" text-anchor="end">0</text>

    <text class="sect" x="18" y="188">ABSENCES</text>
    <line class="rule" x1="18" y1="200" x2="258" y2="200"/>

    <g transform="translate(18 216)">
      <text class="p" x="0" y="10">lundi 7 septembre · 14:00 → 16:00</text>
      <text class="s" x="0" y="30">2h00 · motif écrit par</text>
      <text class="s" x="0" y="46">l'établissement</text>
      <g transform="translate(180 56)">
        <rect x="0" y="0" width="60" height="20" rx="10" fill="#f2f4f7"/>
        <text class="chip" x="30" y="14" fill="#475467" text-anchor="middle">justifiée</text>
      </g>
    </g>

    <line class="rule" x1="18" y1="304" x2="258" y2="304"/>
    <text class="s" x="18" y="328">Valeurs fictives — illustration</text>
  </g>
</svg>
